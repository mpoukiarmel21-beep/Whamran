name: Build Whamran IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -scheme Whamran \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            | tee build.log

      - name: Check build product
        run: |
          APP=$(find build/Build/Products -name "Whamran.app" -maxdepth 2 | head -n 1)
          echo "APP=$APP"
          test -n "$APP" || { echo "App non trouvé"; tail -n 40 build.log; exit 1; }

      - name: Ad-hoc codesign
        run: |
          APP=$(find build/Build/Products -name "Whamran.app" -maxdepth 2 | head -n 1)
          codesign --force --sign - "$APP"

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "Whamran.app" -maxdepth 2 | head -n 1)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Whamran.ipa Payload
          ls -lh Whamran.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whamran-ipa
          path: Whamran.ipa

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Whamran.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
